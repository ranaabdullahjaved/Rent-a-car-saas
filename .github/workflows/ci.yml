name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build, typecheck
    runs-on: ubuntu-latest

    # These four are read at module load and throw if absent, so the build
    # cannot complete without them. The values are placeholders — nothing
    # here connects to a real service. Real credentials live in Vercel.
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      DATABASE_URL_UNPOOLED: postgres://ci:ci@localhost:5432/ci
      DATABASE_SSL: 'false'
      DEPLOYMENT: server
      R2_ACCOUNT_ID: ci-placeholder-account-id
      R2_ACCESS_KEY_ID: ci-placeholder
      R2_SECRET_ACCESS_KEY: ci-placeholder
      R2_BUCKET_NAME: ci-placeholder
      RESEND_API_KEY: re_ci_placeholder
      WHATSAPP_TOKEN: ci-placeholder
      WHATSAPP_PHONE_ID: ci-placeholder
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-in-production
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

      # Must run AFTER build. Next generates route types (LayoutProps,
      # PageProps) into .next/types during the build; running tsc first
      # fails with "Cannot find name 'LayoutProps'".
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Check for uncommitted schema drift
        run: |
          npx drizzle-kit check
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is dirty after build. Commit generated files."
            git status --porcelain
            exit 1
          fi
